name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix). Leave empty to reuse the version of the most recent GitHub release.'
        required: false
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the version
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' --repo "${{ github.repository }}")
            VERSION="${LATEST_TAG#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::No version input given and no previous GitHub release found to reuse a version from." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Run type check
        run: bun run typecheck

      - name: Update versions
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: bun run scripts/build-binaries.ts --version="$VERSION"

      - name: Build binaries for all platforms
        run: bun run build:binary:all

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            echo "Publishing ccmanager-${platform}..."
            cd npm/${platform}
            npm publish --access public
            cd ../..
          done

      - name: Publish main package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push version update
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          git add package.json bun.lock npm/*/package.json
          git commit -m "chore: update version to $VERSION"
          git push origin HEAD:main
